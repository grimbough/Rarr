on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (Bioc ${{ matrix.config.bioc-version }})

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-2022, bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/'}
        - { os: macOS-latest, bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/'}
        - { os: ubuntu-24.04, bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/', sys-libs: 'false'}
        - { os: ubuntu-24.04, bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/', sys-libs: 'true'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.email "ghau@example.com"
          git config --global user.name "GitHub Actions User"

      - uses: actions/checkout@v5

      - name: Install system dependencies
        if: ${{ runner.os == 'linux' && matrix.config.sys-libs == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libblosc-dev libzstd-dev

      - name: Remove system dependencies
        if: ${{ runner.os == 'linux' && matrix.config.sys-libs == 'false' }}
        run: sudo apt-get update && sudo apt-get remove -y libblosc-dev libzstd-dev

      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: ${{ matrix.config.bioc-version }}
          bioc-mirror: https://ftp.gwdg.de/pub/misc/bioconductor

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Run BiocCheck
        uses: grimbough/bioc-actions/run-BiocCheck@v1
        with:
          error-on: 'warning'
          arguments: '--no-check-bioc-help --no-check-file-size'

      - name: Test coverage
        if: ${{ matrix.config.os == 'ubuntu-latest' }}
        run: |
          install.packages('covr')
          covr::codecov()
        shell: Rscript {0}

      ## upload the Rcheck folder if the workflow fails
      - name: Upload output
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.os }}-bioc-${{ matrix.bioc-version}}
          path: |
            ${{ steps.build-install-check.outputs.check-dir }}
