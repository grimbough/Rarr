url: https://huber-group-embl.github.io/Rarr/
template:
  bootstrap: 5

reference:
  - title: "Read Zarr data"
    contents:
      - starts_with("read_zarr_")
      - zarr_overview
  - title: "Write Zarr data"
    contents:
      - starts_with("write_zarr_")
      - update_zarr_array
      - create_empty_zarr_array
      - zarr_consolidate_metadata
  - title: "Zarr stores and groups utilities"
    contents:
      - zarr_overview
      - zarr_consolidate_metadata
      - read_zarr_consolidated_metadata
      - write_zarr_group
  - title: "Compression helpers"
    contents:
      - starts_with("use_")
  - title: "Deprecated functions"
    contents:
      - ZarrArray
      - writeZarrArray
